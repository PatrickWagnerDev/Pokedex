<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="shortcut icon" href="assets/icons/Favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variable.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/bgcolor.css">
    <link rel="stylesheet" href="./styles/bgimage.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="init()">
    <header class="site-header">
        <img src="assets/image/Pokedex_Logo.png" alt="Pokedex Logo">
        <input type="text" alt="Searchbar for Pokemon" placeholder="Please enter Pokemon name...">
    </header>
    <main class="main-section">
        <div class="pokedex">
            <img class="pokedex-frame" src="assets/image/Pokedex_Rahmen.png" alt="Pokedex Frame">
            <section class="poketable-wrapper">
                <div id="pokemon-list"></div>
                <button id="load-more-button" class="pokemon-card load-more-button d-none" onclick="loadPokemon()">
                    Load more
                </button>
            </section>
            <section class="pokedata-wrapper" id="pokedata">
                <div class="pokedata-placeholder">
                    <p>Select Pokémon</p>
                </div>
            </section>
            <div class="pokedata-navigation">
                <button id="previous-button" class="navigation-button" onclick="showPreviousPokemon()"
                    disabled>&lt;</button>
                <button id="next-button" class="navigation-button" onclick="showNextPokemon()" disabled>&gt;</button>
            </div>
        </div>
    </main>
    <div id="loading-overlay" class="loading-overlay d-none">
        <img class="loading-spinner" src="assets/icons/Pokeball_Loadindicator.png" alt="Loading...">
    </div>
    <footer class="site-footer">
        <a href="#">Impressum</a>
        <a href="#">Cookie Preferences</a>
    </footer>
</body>
<script src="./scripts/database.js"></script>
<script src="./scripts/templates.js"></script>
<script src="./script.js"></script>

</html>
