<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="shortcut icon" href="assets/icons/Favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variable.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/bgcolor.css">
    <link rel="stylesheet" href="./styles/bgimage.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body onload="init()">
    <header class="site-header">
        <h1 class="site-title">
            <img src="assets/image/Pokedex_Logo.png" alt="Pokédex">
        </h1>
        <div class="search-wrapper">
            <input id="search-input" aria-label="Search Pokémon" aria-controls="search-results" type="text"
                placeholder="Please enter Pokemon name..." oninput="searchPokemon()" data-id="search-input">
            <div id="search-results" class="search-results"></div>
        </div>
    </header>
    <main class="main-section" data-id="content">
        <div class="pokedex">
            <img class="pokedex-frame pokedex-frame-desktop" src="assets/image/Pokedex_Rahmen.png" alt="">
            <img class="pokedex-frame pokedex-frame-mobile" src="assets/image/Pokedex_Rahmen_mobile.png" alt="">
            <section class="poketable-wrapper">
                <div id="pokemon-list"></div>
                <button id="load-more-button" class="pokemon-card load-more-button d-none" onclick="loadPokemon()">
                    Load more
                </button>
            </section>
            <section class="pokedata-wrapper" id="pokedata" aria-live="polite">
                <div class="pokedata-placeholder">
                    <p>Select Pokémon</p>
                </div>
            </section>
            <div class="pokedata-navigation">
                <button aria-label="Previous Pokémon" class="navigation-button previous-button"
                    onclick="showPreviousPokemon()" disabled>&lt;</button>
                <button aria-label="Next Pokémon" class="navigation-button next-button" onclick="showNextPokemon()"
                    disabled>&gt;</button>
            </div>
        </div>
    </main>
    <div id="loading-overlay" class="loading-overlay" popover="manual">
        <img role="status" class="loading-spinner" src="assets/icons/Pokeball_Loadindicator.png" alt="Loading...">
    </div>
    <dialog aria-label="Pokémon details" id="pokedata-dialog" class="pokedata-dialog"
        onclick="closeDialogOnBackdrop(event)" oncancel="handleDialogCancel(event)">
        <button class="dialog-close-button" onclick="closePokedataDialog()" aria-label="Close">X</button>
        <div id="pokedata-dialog-content" class="pokedata-dialog-content" aria-live="polite"></div>
        <div class="dialog-navigation">
            <button aria-label="Previous Pokémon" class="navigation-button previous-button"
                onclick="showPreviousPokemon()" disabled>&lt;</button>
            <button aria-label="Next Pokémon" class="navigation-button next-button" onclick="showNextPokemon()"
                disabled>&gt;</button>
        </div>
    </dialog>
    <footer class="site-footer">
        <a href="#">Impressum</a>
        <a href="#">Cookie Preferences</a>
    </footer>
</body>
<script src="./scripts/database.js"></script>
<script src="./scripts/templates.js"></script>
<script src="./script.js"></script>

</html>
